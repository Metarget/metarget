---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-backdoor-cronjob
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-backdoor-cronjob
rules:
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
- apiGroups:
  - ""
  resources:
  - pods
  - pods/log
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-backdoor-cronjob
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-backdoor-cronjob
subjects:
- kind: ServiceAccount
  name: k8s-backdoor-cronjob
  namespace: kube-system
---
apiVersion: v1
kind: Pod
metadata:
  name: k8s-backdoor-cronjob
  namespace: kube-system
spec:
  serviceAccountName: k8s-backdoor-cronjob
  containers:
  - name: ubuntu
    image: ubuntu:18.04
    imagePullPolicy: IfNotPresent
    command: [ "/bin/bash", "-c", "--" ]
    args: [ "while true; do sleep 30; done;" ]
